name: Dependency Policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zip-policy:
    name: ZIP dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Test policy and reject vulnerable lockfile entries
        run: |
          uv run --python 3.12 python -m unittest discover -s scripts -p 'test_zip_policy.py'
          uv run --python 3.12 python scripts/check-zip-policy.py
