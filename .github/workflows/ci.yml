name: Rust Test, Lint

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "Makefile"
      - "AGENTS.md"
      - "README.md"
      - "scripts/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "Makefile"
      - "AGENTS.md"
      - "README.md"
      - "scripts/**"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Run with debug logging"
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with rust-toolchain.toml
  RUST_NIGHTLY_VERSION: "nightly-2026-01-07"

jobs:
  untrusted-fork:
    name: Untrusted Fork Safety Check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_NIGHTLY_VERSION" --profile minimal --component rustfmt --no-self-update
      - name: Check formatting without private dependencies
        run: cargo +"$RUST_NIGHTLY_VERSION" fmt --all -- --check

  rust-base:
    name: Rust Test & Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Pin the hosted-runner portability fix until phylaxsystems/actions#105
    # lands on main.
    uses: phylaxsystems/actions/.github/workflows/rust-base.yaml@ec61d6a5b50aee981147351197655c6b4f503dd8
    with:
      runner: "ubuntu-latest"
      rust-channel: "nightly-2026-01-07"
      require-lockfile: true
      requires-private-deps: true
      use-nextest: true
      enable-sccache: true
      sccache-backend: "gha"
      deny-checks: "advisories"
      deny-preinstalled: false
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  release-feature-check:
    name: Release Feature Check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      GIT_CONFIG_GLOBAL: /tmp/pcl-release-feature-${{ github.run_id }}-${{ github.run_attempt }}.gitconfig
      RUSTC_WRAPPER: ""
      SCCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Configure Git for private deps
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_APP_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_NIGHTLY_VERSION" --profile minimal --no-self-update
      - name: Check release build surface
        run: make release-check

  agent-smoke:
    name: Agent CLI Smoke
    needs: release-feature-check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      GIT_CONFIG_GLOBAL: /tmp/pcl-agent-smoke-${{ github.run_id }}-${{ github.run_attempt }}.gitconfig
      PCL_AUTH_NO_BROWSER: "1"
      RUSTC_WRAPPER: ""
      SCCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Configure Git for private deps
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_APP_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_NIGHTLY_VERSION" --profile minimal --no-self-update
      - name: Run agent smoke contract
        run: make agent-smoke
