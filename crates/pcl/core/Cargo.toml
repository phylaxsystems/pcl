[package]
name = "pcl-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# workspace deps
pcl-common = { workspace = true }
pcl-phoundry = { workspace = true }

# assertion deps (optional — behind `credible` feature)
assertion-verification = { git = "https://github.com/phylaxsystems/credible-sdk.git", rev = "477e778d4080e78ca6663928df5e32f9a1ce6b4b", optional = true }
assertion-executor = { git = "https://github.com/phylaxsystems/credible-sdk.git", rev = "477e778d4080e78ca6663928df5e32f9a1ce6b4b", default-features = false, optional = true }

# alloy deps
alloy-primitives = { workspace = true }
alloy-json-abi = { workspace = true }
alloy-dyn-abi = { workspace = true }
alloy-sol-types = { workspace = true }

# alloy signing / rpc (on-chain broadcast support)
alloy-signer = { workspace = true }
alloy-signer-local = { workspace = true }
alloy-provider = { workspace = true }
alloy-network = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
rpassword = { workspace = true }

# dapp API client (generated from OpenAPI spec)
dapp-api-client = { workspace = true }

# other workspace deps
clap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
color-eyre = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
colored = { workspace = true }
sha2 = { workspace = true }

# other deps
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
inquire = "0.9"
toml = "0.8.2"
dirs = "6.0.0"
indicatif = "0.18"
open = "5"
tempfile = { workspace = true }
url.workspace = true
uuid.workspace = true

[features]
default = ["full-test"]
full-test = []
credible = ["dep:assertion-executor", "dep:assertion-verification"]

[dev-dependencies]
mockito = "1.2"
rand = "0.8"
# `test-util` lets the config-lock timeout and the submission backoff be
# asserted on a paused clock instead of waiting out real time.
tokio = { workspace = true, features = ["test-util"] }
