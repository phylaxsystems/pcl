[package]
name = "pcl-phoundry"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
credible = ["forge/credible"]

[dependencies]
# Foundry deps — pinned rev, default-features = false to avoid pulling assertion-executor
forge = { git = "https://github.com/phylaxsystems/phoundry.git", rev = "cf6019d75825ce488d74f44163bbe8eddf0053bf", default-features = false }
foundry-config = { git = "https://github.com/phylaxsystems/phoundry.git", rev = "cf6019d75825ce488d74f44163bbe8eddf0053bf", default-features = false }
foundry-cli = { git = "https://github.com/phylaxsystems/phoundry.git", rev = "cf6019d75825ce488d74f44163bbe8eddf0053bf", default-features = false }
foundry-common = { git = "https://github.com/phylaxsystems/phoundry.git", rev = "cf6019d75825ce488d74f44163bbe8eddf0053bf", default-features = false }

foundry-compilers = { version = "0.21.0", default-features = false }

clap = { workspace = true }
thiserror = { workspace = true }
color-eyre = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

alloy-json-abi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
