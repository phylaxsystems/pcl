[package]
edition = "2021"
name = "tch"
version = "0.22.0"
authors = ["Laurent Mazare <lmazare@gmail.com>"]
build = "build.rs"
exclude = ["examples/stable-diffusion/media/*"]
autolib = false
autobins = false
